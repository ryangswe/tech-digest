name: CI

on:
  push:
    branches-ignore: ["claude/digest-*"]  # the delivery workflow validates those
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Workflow check
        run: python3 .claude/workflow/check.py
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Dry run from fixtures
        run: python3 -m techdigest dry-run
